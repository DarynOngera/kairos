name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
  docker-integration:
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'
      - run: mix deps.get
      - name: Build isolated fixture image
        run: docker compose --project-name kairos_ci --file test/fixtures/compose/docker-compose.yml build
      - name: Scan isolated fixture
        run: |
          mkdir -p artifacts
          docker compose --project-name kairos_ci --file test/fixtures/compose/docker-compose.yml up --detach
          KAIROS_DATA=artifacts/data mix kairos.scan --project kairos_ci --file test/fixtures/compose/docker-compose.yml --json > artifacts/scan.json
          KAIROS_DATA=artifacts/data mix kairos.verify > artifacts/verify.txt
      - name: Remove isolated fixture
        if: always()
        run: docker compose --project-name kairos_ci --file test/fixtures/compose/docker-compose.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairos-local-scan
          path: artifacts/
          if-no-files-found: error
  multi-host-contract:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'
      - run: mix deps.get
      - name: Verify normalized collector contract
        run: mix test test/kairos/collector_plug_test.exs
